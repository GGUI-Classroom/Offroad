<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Offroader v6</title>
<style>
html,body{width:100%;height:100%;margin:0;background:#e9edf2;font-family:system-ui,-apple-system,Segoe UI,sans-serif}
#app{width:100%;height:100%;margin:0;border:0;display:block;background:#e9edf2;opacity:0;pointer-events:none;transition:opacity .16s ease}
#app.ready{opacity:1;pointer-events:auto}
#boot{position:fixed;inset:0;z-index:5;display:grid;place-items:center;background:#e9edf2;color:#0f172a}
#boot.hidden{display:none}.bootcard{background:#fff;border-radius:22px;padding:20px 24px;box-shadow:0 12px 35px #0f172a20;text-align:center;font-weight:850}.bootsub{font-size:12px;font-weight:600;color:#64748b;margin-top:5px}
</style>
</head>
<body>
<div id="boot"><div class="bootcard">Loading Offroader<div class="bootsub">Starting no-key routing and camera layers…</div></div></div>
<iframe id="app" src="offroader-v3.html?v=6" title="Offroader"></iframe>
<script>
const frame=document.getElementById('app');
const boot=document.getElementById('boot');
function reveal(){frame.classList.add('ready');boot.classList.add('hidden')}
frame.addEventListener('load',()=>{
  try{
    const d=frame.contentDocument;
    if(!d){reveal();return;}
    const load=(id,src)=>new Promise((resolve,reject)=>{
      if(d.getElementById(id)){resolve();return;}
      const s=d.createElement('script');
      s.id=id;s.src=src;s.onload=resolve;s.onerror=()=>reject(new Error('Failed to load '+src));d.body.appendChild(s);
    });
    load('noKeyRoutingScript','no-key-routing.js?v=6.2')
      .then(()=>load('oregonLayerScript','oregon-layers.js?v=6.2'))
      .then(()=>load('portlandLiveScript','portland-live.js?v=6.2'))
      .then(reveal)
      .catch(e=>{console.error('Offroader v6 extension failed to load',e);boot.querySelector('.bootsub').textContent='A camera/routing module failed to load. Refresh this page.';});
  }catch(e){console.error(e);reveal();}
});
</script>
</body>
</html>
