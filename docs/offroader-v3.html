*{box-sizing:border-box}html,body,#map{height:100%;margin:0}button,input{font:inherit}button{cursor:pointer}#map{position:absolute;inset:0;background:#e9eef4}.leaflet-control-attribution{font-size:9px!important}.leaflet-control-zoom{border:0!important;box-shadow:0 6px 20px rgba(15,23,42,.14)!important}.leaflet-control-zoom a{border:0!important;color:#0f172a!important}

.mapButtons{position:absolute;z-index:1000;right:13px;top:86px;display:flex;flex-direction:column;gap:8px}.mapBtn{width:46px;height:46px;border:1px solid rgba(255,255,255,.9);border-radius:16px;background:var(--card);box-shadow:0 5px 18px rgba(15,23,42,.14);color:#0f172a;font-size:18px;font-weight:800}.mapBtn.active{background:#0f172a;color:#fff}.dataPill{position:absolute;z-index:950;left:50%;bottom:18px;transform:translateX(-50%);background:rgba(15,23,42,.9);color:#fff;border-radius:999px;padding:8px 12px;font-size:11px;font-weight:700;box-shadow:0 6px 20px rgba(15,23,42,.2);white-space:nowrap;transition:.2s}.dataPill.sheetOpen{bottom:330px}
.sheet{position:absolute;z-index:1150;left:50%;bottom:14px;transform:translateX(-50%);width:min(720px,calc(100% - 24px));max-height:62%;overflow:auto;background:var(--card);backdrop-filter:blur(18px);border-radius:24px;box-shadow:0 16px 50px rgba(15,23,42,.23);border:1px solid rgba(255,255,255,.85);padding:14px}.sheetHandle{width:42px;height:5px;border-radius:999px;background:#d8dee8;margin:0 auto 10px}.sheetHead{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}.sheetTitle{font-size:18px;font-weight:900;color:#0f172a;line-height:1.15}.sheetSub{font-size:12px;color:#64748b;margin-top:4px}.closeBtn{width:36px;height:36px;border:0;border-radius:12px;background:#eef2f7;color:#475569;font-size:18px}.primaryBtn,.secondaryBtn{border:0;border-radius:14px;padding:10px 13px;font-weight:800}.primaryBtn{background:#2563eb;color:#fff}.secondaryBtn{background:#eef2f7;color:#1e293b}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.seg{display:flex;background:#eef2f7;border-radius:14px;padding:3px;gap:3px}.seg button{border:0;border-radius:11px;background:transparent;color:#64748b;padding:8px 11px;font-size:12px;font-weight:800}.seg button.on{background:#fff;color:#0f172a;box-shadow:0 1px 5px rgba(15,23,42,.08)}
.cameraBox{margin-top:12px;background:#05070a;border-radius:18px;min-height:210px;display:grid;place-items:center;overflow:hidden;color:#e2e8f0;text-align:center;position:relative}.cameraBox img,.cameraBox video{display:block;width:100%;height:auto;max-height:420px;object-fit:contain;background:#000}.liveBadge{position:absolute;top:10px;left:10px;z-index:3;background:#dc2626;color:#fff;border-radius:999px;padding:5px 8px;font-size:10px;font-weight:900;letter-spacing:.05em}.camFallback{padding:20px}.camFallback b{display:block;color:#fff;margin-bottom:5px}.camFallback span{font-size:12px;color:#cbd5e1}.cameraNote{margin-top:9px;font-size:12px;color:#64748b}.cam-marker{width:15px;height:15px;border-radius:50%;border:3px solid #fff;box-shadow:0 2px 7px rgba(0,0,0,.35)}.cam-marker.live{background:#16a34a}.cam-marker.photo{background:#64748b}.trafficdot{width:9px;height:9px;border-radius:50%;border:2px solid #fff;box-shadow:0 1px 4px #0005}.meDot{width:19px;height:19px;border-radius:50%;background:#2563eb;border:4px solid #fff;box-shadow:0 0 0 2px rgba(37,99,235,.35)}.destPin{width:20px;height:20px;border-radius:50% 50% 50% 0;background:#ef4444;border:3px solid #fff;transform:rotate(-45deg);box-shadow:0 2px 6px #0005}
.routeHero{display:flex;justify-content:space-between;gap:12px;align-items:flex-end;margin-top:4px}.eta{font-size:34px;font-weight:950;letter-spacing:-.04em;color:#0f172a}.arrival{font-size:12px;color:#64748b;margin-top:1px}.routeMeta{text-align:right}.routeMeta b{font-size:15px}.provider{display:inline-flex;align-items:center;gap:6px;margin-top:8px;border-radius:999px;padding:6px 9px;background:#eff6ff;color:#1d4ed8;font-size:11px;font-weight:800}.provider.fallback{background:#fff7ed;color:#c2410c}.alts{display:flex;gap:7px;overflow:auto;margin:12px -2px 4px;padding:2px}.altCard{min-width:155px;text-align:left;border:1px solid #e2e8f0;background:#fff;border-radius:16px;padding:10px}.altCard.on{border-color:#2563eb;box-shadow:0 0 0 2px rgba(37,99,235,.1)}.altCard b{display:block;font-size:14px}.altCard span{font-size:11px;color:#64748b}.notice{margin-top:10px;border-radius:14px;padding:10px 11px;background:#f8fafc;color:#475569;font-size:12px;line-height:1.35}.notice.warn{background:#fff7ed;color:#9a3412}.notice.good{background:#ecfdf5;color:#166534}.steps{margin-top:10px;border-top:1px solid #eef2f7}.step{display:grid;grid-template-columns:28px 1fr auto;gap:8px;align-items:center;padding:9px 2px;border-bottom:1px solid #f1f5f9}.stepIcon{width:26px;height:26px;border-radius:9px;background:#f1f5f9;display:grid;place-items:center;font-size:12px;font-weight:900;color:#334155}.stepText{font-size:13px;color:#1e293b}.stepDist{font-size:11px;color:#94a3b8;font-weight:700}.settingsGrid{display:grid;gap:10px;margin-top:12px}.field label{display:block;font-size:11px;font-weight:800;color:#64748b;margin:0 0 5px 2px}.field input{width:100%;border:1px solid #dbe3ec;border-radius:14px;background:#fff;padding:11px 12px;outline:0}.field input:focus{border-color:#60a5fa;box-shadow:0 0 0 3px rgba(96,165,250,.15)}.switchRow{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:10px 0}.switchRow b{font-size:13px}.switchRow span{display:block;font-size:11px;color:#64748b;margin-top:2px}.toggle{min-width:48px;height:28px;border:0;border-radius:999px;background:#cbd5e1;position:relative}.toggle::after{content:"";position:absolute;top:4px;left:4px;width:20px;height:20px;border-radius:50%;background:white;transition:.15s}.toggle.on{background:#2563eb}.toggle.on::after{left:24px}.spinner{width:30px;height:30px;border-radius:50%;border:3px solid #ffffff2d;border-top-color:#fff;animation:spin .8s linear infinite;margin:0 auto 9px}@keyframes spin{to{transform:rotate(360deg)}}
@media(max-width:600px){.topbar{top:8px;left:8px;right:8px}.searchBox{height:52px;border-radius:18px}.suggestions{top:59px}.mapButtons{right:9px;top:70px}.mapBtn{width:44px;height:44px;border-radius:15px}.sheet{bottom:8px;width:calc(100% - 16px);max-height:66%;border-radius:22px}.dataPill{bottom:12px;max-width:80%;overflow:hidden;text-overflow:ellipsis}.dataPill.sheetOpen{bottom:370px}.eta{font-size:30px}}
</style>

<body>
<div id="map"></div>
<div class="topbar"><div class="searchShell"><div class="searchBox"><button id="brandBtn" class="brandMark" title="Offroader">O</button><input id="query" autocomplete="off" placeholder="Search destination"><button id="clearSearch" class="searchClear hidden" aria-label="Clear">×</button></div><div id="suggestions" class="suggestions hidden"></div></div></div>
<div class="mapButtons"><button id="locBtn" class="mapBtn" title="My location">◎</button><button id="camBtn" class="mapBtn active" title="Live cameras">◉</button><button id="trafficBtn" class="mapBtn" title="Traffic detectors">≋</button><button id="settingsBtn" class="mapBtn" title="Settings">⚙</button></div>
<div id="dataPill" class="dataPill">Loading live data…</div>
<div id="sheet" class="sheet hidden"></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/hls.js@1/dist/hls.min.js"></script>
<script>
const TRAFFIC_URL='https://raw.githubusercontent.com/GGUI-Classroom/Offroad/traffic-data/wa-traffic.json';
const CAMERAS_URL='https://raw.githubusercontent.com/GGUI-Classroom/Offroad/traffic-data/seattle-cameras.json';
const SDOT_VIEWER='https://web.seattle.gov/Travelers/';
const OSRM='https://router.project-osrm.org';
const map=L.map('map',{zoomControl:false,preferCanvas:true}).setView([47.55,-122.19],10);
L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png',{subdomains:'abcd',maxZoom:20,attribution:'© OpenStreetMap contributors © CARTO'}).addTo(map);
L.control.zoom({position:'bottomright'}).addTo(map);
const cameraLayer=L.layerGroup().addTo(map),photoLayer=L.layerGroup(),detectorLayer=L.layerGroup(),routeLayer=L.layerGroup().addTo(map),altLayer=L.layerGroup().addTo(map);
let trafficData=null,cameraData=null,myLocation=null,myMarker=null,destination=null,destMarker=null,currentHls=null,videoTimer=null,searchTimer=null,routeReq=0,currentChoices=[],currentChoiceIndex=0;
let showDetectors=false,showPhotoCams=false,showLiveCams=true;
const $=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
const mapboxToken=()=>localStorage.getItem('offroader_mapbox_token')||'';
function fmtDist(m){return m<1000?Math.round(m)+' m':(m/1609.344).toFixed(m>16093?0:1)+' mi'}
function fastMeters(a,b,c,d){const mean=(a+c)*Math.PI/360,dx=(d-b)*Math.cos(mean),dy=c-a;return 111320*Math.sqrt(dx*dx+dy*dy)}
function trafficColor(mph){if(!Number.isFinite(mph))return'#2563eb';if(mph>=50)return'#16a34a';if(mph>=35)return'#d69e00';if(mph>=20)return'#ea580c';return'#dc2626'}
function trafficFactor(mph){if(mph>=55)return 1;if(mph>=45)return 1.06;if(mph>=35)return 1.15;if(mph>=25)return 1.31;if(mph>=15)return 1.55;return 1.95}
function nearestSensor(lat,lon,max=1000){if(!trafficData?.sensors)return null;let best=null,bd=max;for(const s of trafficData.sensors){if(!Number.isFinite(s.lat)||!Number.isFinite(s.lon)||!Number.isFinite(s.mph))continue;const d=fastMeters(lat,lon,s.lat,s.lon);if(d<bd){bd=d;best=s}}return best?{sensor:best,distance:bd}:null}
function setSheet(html=''){const s=$('sheet');stopVideo();if(!html){s.classList.add('hidden');s.innerHTML='';$('dataPill').classList.remove('sheetOpen');return}s.innerHTML='<div class="sheetHandle"></div>'+html;s.classList.remove('hidden');$('dataPill').classList.add('sheetOpen');s.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>setSheet())}
function dataText(){const t=trafficData?.sensors?.length||0;const cams=cameraData?.cameras||[];const live=cams.filter(isLiveCapable).length;const photo=cams.length-live;return `${t?t+' traffic sensors':'Traffic unavailable'} · ${live?live+' live cams':'Live cams unavailable'}${showPhotoCams&&photo?' · '+photo+' photo cams':''}`}
function refreshDataPill(){$('dataPill').textContent=dataText()}
function liveUrlFor(c){if(c?.stream_url)return c.stream_url;const type=String(c?.camera_type||'').toLowerCase();if(type!=='sdot')return'';let stream=c.stream_name||'';if(!stream&&c.image_url){let f=c.image_url.split('/').pop().split('?')[0].trim();stream=/\.jpe?g$/i.test(f)?f.replace(/\.jpe?g$/i,'.stream'):f+'.stream'}const template=cameraData?.stream_template||'';return stream&&template.includes('{stream}')?template.replace('{stream}',stream):''}
function isLiveCapable(c){return !!liveUrlFor(c)}
function stopVideo(){if(videoTimer){clearTimeout(videoTimer);videoTimer=null}if(currentHls){try{currentHls.destroy()}catch{}currentHls=null}const v=$('cameraVideo');if(v){try{v.pause();v.removeAttribute('src');v.load()}catch{}}}
async function loadTraffic(){try{const r=await fetch(TRAFFIC_URL+'?v='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error('traffic '+r.status);const j=await r.json();if(!Array.isArray(j.sensors))throw Error('bad traffic cache');trafficData=j;if(showDetectors)drawDetectors()}catch(e){console.warn(e);trafficData=null}refreshDataPill()}
async function loadCameras(){try{const r=await fetch(CAMERAS_URL+'?v='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error('camera '+r.status);const j=await r.json();if(!Array.isArray(j.cameras))throw Error('bad camera cache');cameraData=j;drawCameras()}catch(e){console.warn(e);cameraData=null}refreshDataPill()}
function drawCameras(){cameraLayer.clearLayers();photoLayer.clearLayers();for(const c of cameraData?.cameras||[]){if(!Number.isFinite(c.lat)||!Number.isFinite(c.lon))continue;const live=isLiveCapable(c);const icon=L.divIcon({className:'',html:`<div class="cam-marker ${live?'live':'photo'}"></div>`,iconSize:[15,15],iconAnchor:[7,7]});const marker=L.marker([c.lat,c.lon],{icon,title:c.description||'Traffic camera'}).on('click',()=>openCamera(c));(live?cameraLayer:photoLayer).addLayer(marker)}if(showLiveCams&&!map.hasLayer(cameraLayer))cameraLayer.addTo(map);if(showPhotoCams&&!map.hasLayer(photoLayer))photoLayer.addTo(map)}
function drawDetectors(){detectorLayer.clearLayers();for(const s of trafficData?.sensors||[]){if(!Number.isFinite(s.lat)||!Number.isFinite(s.lon)||!Number.isFinite(s.mph))continue;const icon=L.divIcon({className:'',html:`<div class="trafficdot" style="background:${trafficColor(s.mph)}"></div>`,iconSize:[9,9],iconAnchor:[4,4]});L.marker([s.lat,s.lon],{icon,keyboard:false}).bindTooltip(`${esc(s.route||s.roadway||'WSDOT')} ${esc(s.direction||'')} · ${Math.round(s.mph)} mph`).addTo(detectorLayer)}}
function showSnapshot(c,message='Current camera image'){stopVideo();const img=c.image_url||'';const box=$('cameraBox');if(!box)return;box.innerHTML=img?`<img id="cameraImage" src="${esc(img+(img.includes('?')?'&':'?')+'t='+Date.now())}" alt="Current traffic camera image">`:'<div class="camFallback"><b>No image available</b><span>This source did not publish a current picture.</span></div>';const note=$('cameraNote');if(note)note.textContent=message;const liveBtn=$('liveMode');if(liveBtn)liveBtn.classList.remove('on');const picBtn=$('photoMode');if(picBtn)picBtn.classList.add('on')}
function fallbackToSnapshot(c,why){showSnapshot(c,why?'Live video unavailable right now. Showing the current image instead.':'Showing current image.');const box=$('cameraBox');if(box&&c.image_url){const badge=document.createElement('div');badge.className='liveBadge';badge.style.background='#475569';badge.textContent='PHOTO';box.appendChild(badge)}}
async function showLive(c){const url=liveUrlFor(c);if(!url){showSnapshot(c,'This source publishes a current image but no public live-video endpoint.');return}stopVideo();$('liveMode')?.classList.add('on');$('photoMode')?.classList.remove('on');const box=$('cameraBox');if(!box)return;box.innerHTML='<div><div class="spinner"></div><div style="font-weight:800">Connecting to live camera…</div></div>';let played=false,retried=false;const start=()=>{box.innerHTML=`<div class="liveBadge">LIVE</div><video id="cameraVideo" controls autoplay muted playsinline ${c.image_url?`poster="${esc(c.image_url)}"`:''}></video>`;const v=$('cameraVideo');const good=()=>{played=true;if(videoTimer){clearTimeout(videoTimer);videoTimer=null};const n=$('cameraNote');if(n)n.textContent='Live SDOT traffic video.'};const fail=()=>{if(!played)fallbackToSnapshot(c,true)};v.addEventListener('playing',good,{once:true});v.addEventListener('error',fail,{once:true});videoTimer=setTimeout(fail,9000);if(v.canPlayType('application/vnd.apple.mpegurl')){v.src=url;v.play().catch(()=>{});return}if(!window.Hls||!Hls.isSupported()){fail();return}currentHls=new Hls({enableWorker:true,manifestLoadingTimeOut:6500,levelLoadingTimeOut:6500,fragLoadingTimeOut:6500,liveSyncDurationCount:2,liveMaxLatencyDurationCount:5});currentHls.attachMedia(v);currentHls.on(Hls.Events.MEDIA_ATTACHED,()=>currentHls.loadSource(url));currentHls.on(Hls.Events.MANIFEST_PARSED,()=>v.play().catch(()=>{}));currentHls.on(Hls.Events.ERROR,(_,d)=>{if(!d?.fatal)return;if(d.type===Hls.ErrorTypes.NETWORK_ERROR&&!retried){retried=true;try{currentHls.startLoad()}catch{};return}if(d.type===Hls.ErrorTypes.MEDIA_ERROR&&!retried){retried=true;try{currentHls.recoverMediaError()}catch{};return}fail()})};start()}
function openCamera(c){const live=isLiveCapable(c);setSheet(`<div class="sheetHead"><div><div class="sheetTitle">${esc(c.description||'Traffic camera')}</div><div class="sheetSub">${live?'Seattle SDOT live camera':'Traffic camera image'}${c.id?' · '+esc(c.id):''}</div></div><button class="closeBtn" data-close>×</button></div><div id="cameraBox" class="cameraBox"></div><div class="row" style="margin-top:10px"><div class="seg">${live?'<button id="liveMode" class="on">Live</button>':''}<button id="photoMode" class="${live?'':'on'}">Picture</button></div><button id="officialCam" class="secondaryBtn">Official viewer</button></div><div id="cameraNote" class="cameraNote"></div>`);if(live){$('liveMode').onclick=()=>showLive(c);$('photoMode').onclick=()=>showSnapshot(c);showLive(c)}else{$('photoMode').onclick=()=>showSnapshot(c);showSnapshot(c,'This camera source is snapshot-only in the public feed.')} $('officialCam').onclick=()=>window.open(SDOT_VIEWER,'_blank','noopener')}
function setLocation(lat,lon,recenter=false){myLocation={lat,lon};const ll=[lat,lon];if(!myMarker)myMarker=L.marker(ll,{icon:L.divIcon({className:'',html:'<div class="meDot"></div>',iconSize:[19,19],iconAnchor:[9,9]})}).addTo(map);else myMarker.setLatLng(ll);if(recenter)map.setView(ll,15);if(destination)makeRoute()}
function locate(recenter=true){if(!navigator.geolocation){showMessage('Location is not available in this browser.');return}navigator.geolocation.getCurrentPosition(p=>setLocation(p.coords.latitude,p.coords.longitude,recenter),e=>showMessage('Could not get your location: '+e.message),{enableHighAccuracy:true,timeout:12000,maximumAge:15000})}
map.on('contextmenu',e=>{setLocation(e.latlng.lat,e.latlng.lng,false);showMessage('Test start point set here.')});
function showMessage(text){setSheet(`<div class="sheetHead"><div><div class="sheetTitle">Offroader</div><div class="sheetSub">${esc(text)}</div></div><button class="closeBtn" data-close>×</button></div>`)}
function placeParts(x){const a=x.address||{},title=x.name||String(x.display_name||'').split(',')[0]||'Place';const locality=a.city||a.town||a.village||a.hamlet||a.county||'';const state=a.state||'';const sub=[a.house_number&&a.road?[a.house_number,a.road].join(' '):a.road,locality,state].filter(Boolean).join(', ')||String(x.display_name||'').split(',').slice(1,4).join(',').trim();return{title,sub}}
function placeDistance(x){if(!myLocation)return'';const m=fastMeters(myLocation.lat,myLocation.lon,+x.lat,+x.lon);return fmtDist(m)}
async function searchPlaces(){const q=$('query').value.trim(),box=$('suggestions');$('clearSearch').classList.toggle('hidden',!q);if(q.length<2){box.classList.add('hidden');return}box.classList.remove('hidden');box.innerHTML='<div class="searchState">Searching…</div>';try{const center=myLocation||{lat:map.getCenter().lat,lon:map.getCenter().lng};const span=3.2,viewbox=`${center.lon-span},${center.lat+span},${center.lon+span},${center.lat-span}`;const url='https://nominatim.openstreetmap.org/search?format=jsonv2&limit=5&countrycodes=us&addressdetails=1&dedupe=1&viewbox='+encodeURIComponent(viewbox)+'&q='+encodeURIComponent(q);const r=await fetch(url,{headers:{Accept:'application/json'}});if(!r.ok)throw Error('search '+r.status);const data=(await r.json()).slice(0,5);if(!data.length){box.innerHTML='<div class="searchState">No matching U.S. places.</div>';return}box.innerHTML=data.map((x,i)=>{const p=placeParts(x),d=placeDistance(x);return `<button class="result" data-i="${i}"><span class="resultIcon">⌖</span><span><div class="rTitle">${esc(p.title)}</div><div class="rSub">${esc(p.sub||x.display_name)}</div></span><span class="rDist">${esc(d)}</span></button>`}).join('');box.querySelectorAll('.result').forEach(b=>b.onclick=()=>selectPlace(data[+b.dataset.i]))}catch(e){console.warn(e);box.innerHTML='<div class="searchState">Search is temporarily unavailable.</div>'}}
function selectPlace(x){const p=placeParts(x);destination={lat:+x.lat,lon:+x.lon,name:x.display_name||p.title,title:p.title};$('query').value=p.title;$('suggestions').classList.add('hidden');$('clearSearch').classList.remove('hidden');if(destMarker)map.removeLayer(destMarker);destMarker=L.marker([destination.lat,destination.lon],{icon:L.divIcon({className:'',html:'<div class="destPin"></div>',iconSize:[20,20],iconAnchor:[10,20]})}).addTo(map);if(myLocation)makeRoute();else locate(false)}
$('query').addEventListener('input',()=>{clearTimeout(searchTimer);searchTimer=setTimeout(searchPlaces,280)});$('query').addEventListener('keydown',e=>{if(e.key==='Enter')searchPlaces();if(e.key==='Escape')$('suggestions').classList.add('hidden')});$('clearSearch').onclick=()=>{$('query').value='';$('suggestions').classList.add('hidden');$('clearSearch').classList.add('hidden');$('query').focus()};document.addEventListener('click',e=>{if(!e.target.closest('.searchShell'))$('suggestions').classList.add('hidden')});
function sampleTraffic(route){const coords=route.geometry?.coordinates||[];if(!coords.length||!trafficData?.sensors?.length)return{sensorCount:0,avgMph:null,factor:1,coverage:0,adjustedSeconds:route.duration};const stride=Math.max(1,Math.floor(coords.length/190)),samples=[];for(let i=0;i<coords.length;i+=stride)samples.push(coords[i]);const matches=[],unique=new Map();for(const c of samples){const n=nearestSensor(c[1],c[0],1050);if(n){matches.push(n);unique.set(n.sensor.name||`${n.sensor.lat},${n.sensor.lon}`,n.sensor)}}if(!matches.length)return{sensorCount:0,avgMph:null,factor:1,coverage:0,adjustedSeconds:route.duration};let w=0,f=0,s=0;for(const m of matches){const x=Math.max(.15,1-m.distance/1200);w+=x;f+=x*trafficFactor(m.sensor.mph);s+=x*m.sensor.mph}const raw=f/w,cov=matches.length/samples.length,confidence=Math.min(1,cov*1.8),factor=1+(raw-1)*confidence;return{sensorCount:unique.size,avgMph:s/w,factor,coverage:cov,adjustedSeconds:route.duration*factor}}
function turnPenalty(route){const steps=route.legs?.flatMap(l=>l.steps||[])||[];let p=0,shorts=0;for(const s of steps){const type=s.maneuver?.type||'';const mod=s.maneuver?.modifier||'';if(type==='turn')p+=mod.includes('left')?7:4;else if(type==='uturn'||mod==='uturn')p+=35;else if(type==='roundabout'||type==='rotary')p+=4;if((s.distance||0)<60)shorts++}if(shorts>4)p+=(shorts-4)*3;return p}
function scoreOsrmRoute(route){const t=sampleTraffic(route),trafficOk=t.sensorCount>=2&&t.coverage>=.04;const eta=trafficOk?t.adjustedSeconds:route.duration;const score=eta+turnPenalty(route)+Math.max(0,(route.distance-5000)/3000);return{live:t,trafficOk,eta,score}}
function stepInstruction(s){if(s.maneuver?.instruction)return s.maneuver.instruction;const m=s.maneuver||{},type=m.type||'continue',mod=(m.modifier||'').replace(/_/g,' '),name=s.name?` onto ${s.name}`:'';if(type==='depart')return `Head ${mod||'forward'}${name}`;if(type==='arrive')return 'Arrive at your destination';if(type==='turn')return `Turn ${mod||''}${name}`.replace(/\s+/g,' ').trim();if(type==='merge')return `Merge ${mod||''}${name}`.replace(/\s+/g,' ').trim();if(type==='on ramp')return `Take the ramp ${mod||''}${name}`.replace(/\s+/g,' ').trim();if(type==='off ramp')return `Take the exit ${mod||''}${name}`.replace(/\s+/g,' ').trim();if(type==='fork')return `Keep ${mod||'straight'}${name}`;if(type==='roundabout'||type==='rotary')return `Enter the roundabout${m.exit?' and take exit '+m.exit:''}${name}`;if(type==='new name')return `Continue${name}`;return `Continue ${mod||''}${name}`.replace(/\s+/g,' ').trim()}
function maneuverIcon(s){const t=s.maneuver?.type||'',m=s.maneuver?.modifier||'';if(t==='arrive')return'✓';if(t==='roundabout'||t==='rotary')return'⟳';if(m.includes('left'))return'↰';if(m.includes('right'))return'↱';if(t.includes('ramp'))return'↗';return'↑'}
async function routeMapbox(){const token=mapboxToken(),coords=`${myLocation.lon},${myLocation.lat};${destination.lon},${destination.lat}`;const url=`https://api.mapbox.com/directions/v5/mapbox/driving-traffic/${coords}?alternatives=true&steps=true&overview=full&geometries=geojson&annotations=congestion_numeric,closure&language=en&access_token=${encodeURIComponent(token)}`;const r=await fetch(url);if(!r.ok)throw Error('Mapbox routing '+r.status);const j=await r.json();if(j.code!=='Ok'||!j.routes?.length)throw Error(j.message||'No Mapbox route');return j.routes.map((route,i)=>({i,route,provider:'mapbox',trafficOk:true,eta:route.duration,score:route.weight??route.duration,live:null}))}
async function routeOsrm(){if(!trafficData)await loadTraffic();const coords=`${myLocation.lon},${myLocation.lat};${destination.lon},${destination.lat}`;const r=await fetch(`${OSRM}/route/v1/driving/${coords}?alternatives=3&steps=true&overview=full&geometries=geojson`);if(!r.ok)throw Error('OSRM routing '+r.status);const j=await r.json();if(j.code!=='Ok'||!j.routes?.length)throw Error(j.message||'No route');return j.routes.map((route,i)=>{const s=scoreOsrmRoute(route);return{i,route,provider:'offroader',...s}}).sort((a,b)=>a.score-b.score).map((x,i)=>({...x,i}))}
async function makeRoute(){if(!myLocation||!destination)return;const req=++routeReq;setSheet(`<div class="sheetHead"><div><div class="sheetTitle">Finding the best route…</div><div class="sheetSub">Checking alternatives and current traffic.</div></div><button class="closeBtn" data-close>×</button></div>`);try{let choices,provider;if(mapboxToken()){try{choices=await routeMapbox();provider='mapbox'}catch(e){console.warn(e);choices=await routeOsrm();provider='offroader'}}else{choices=await routeOsrm();provider='offroader'}if(req!==routeReq)return;currentChoices=choices;currentChoiceIndex=0;drawRouteChoices();renderRouteSheet(provider)}catch(e){console.error(e);setSheet(`<div class="sheetHead"><div><div class="sheetTitle">Couldn’t build a route</div><div class="sheetSub">${esc(e.message)}</div></div><button class="closeBtn" data-close>×</button></div>`)} }
function drawRouteChoices(){routeLayer.clearLayers();altLayer.clearLayers();currentChoices.forEach((x,i)=>{const layer=L.geoJSON(x.route.geometry,{style:{color:i===currentChoiceIndex?'#2563eb':'#64748b',weight:i===currentChoiceIndex?7:5,opacity:i===currentChoiceIndex?.95:.25}});(i===currentChoiceIndex?routeLayer:altLayer).addLayer(layer);if(i!==currentChoiceIndex)layer.on('click',()=>chooseRoute(i))});const chosen=currentChoices[currentChoiceIndex];if(chosen){const b=L.geoJSON(chosen.route.geometry).getBounds();map.fitBounds(b,{paddingTopLeft:[28,90],paddingBottomRight:[28,320]})}}
function arrivalText(seconds){const d=new Date(Date.now()+seconds*1000);return d.toLocaleTimeString([],{hour:'numeric',minute:'2-digit'})}
function routeLabel(x){const r=x.route,mins=Math.max(1,Math.round(x.eta/60)),miles=(r.distance/1609.344).toFixed(1);return{mins,miles}}
function renderRouteSheet(providerOverride){const chosen=currentChoices[currentChoiceIndex];if(!chosen)return;const r=chosen.route,l=routeLabel(chosen),steps=(r.legs?.flatMap(x=>x.steps||[])||[]);const provider=providerOverride||chosen.provider;const typical=r.duration_typical?Math.round(r.duration_typical/60):null,delay=typical?Math.max(0,l.mins-typical):null;const mapbox=provider==='mapbox';const trafficNotice=mapbox?'Mapbox driving-traffic is using current and typical traffic plus incidents where available.':chosen.trafficOk?`Offroader scored this route with ${chosen.live.sensorCount} nearby WSDOT detectors (${Math.round(chosen.live.coverage*100)}% sampled coverage).`:'Live WSDOT coverage is limited here, so this route relies mostly on road-network travel times.';setSheet(`<div class="sheetHead"><div><div class="sheetTitle">${esc(destination.title||destination.name)}</div><div class="sheetSub">${esc(destination.name)}</div></div><button class="closeBtn" data-close>×</button></div><div class="routeHero"><div><div class="eta">${l.mins} min</div><div class="arrival">Arrive around ${arrivalText(chosen.eta)}</div></div><div class="routeMeta"><b>${l.miles} mi</b><div class="sheetSub">${delay!=null&&delay>0?'~'+delay+' min traffic delay':'Fastest selected'}</div></div></div><div class="provider ${mapbox?'':'fallback'}">${mapbox?'Traffic-aware routing':'Offroader + WSDOT scoring'}</div><div class="alts">${currentChoices.map((x,i)=>{const q=routeLabel(x);return `<button class="altCard ${i===currentChoiceIndex?'on':''}" data-alt="${i}"><b>${q.mins} min · ${q.miles} mi</b><span>${i===0?'Recommended':'Alternative '+(i+1)}</span></button>`}).join('')}</div><div class="notice ${mapbox||chosen.trafficOk?'good':'warn'}">${esc(trafficNotice)}</div><div class="steps">${steps.slice(0,14).map(s=>`<div class="step"><span class="stepIcon">${maneuverIcon(s)}</span><span class="stepText">${esc(stepInstruction(s))}</span><span class="stepDist">${fmtDist(s.distance||0)}</span></div>`).join('')}</div><div class="row" style="margin-top:11px"><button id="reroute" class="primaryBtn">Refresh route</button><button id="routeSettings" class="secondaryBtn">Routing settings</button></div>`);document.querySelectorAll('[data-alt]').forEach(b=>b.onclick=()=>chooseRoute(+b.dataset.alt));$('reroute').onclick=makeRoute;$('routeSettings').onclick=openSettings}
function chooseRoute(i){currentChoiceIndex=i;drawRouteChoices();renderRouteSheet(currentChoices[i]?.provider)}
function openSettings(){const token=mapboxToken();setSheet(`<div class="sheetHead"><div><div class="sheetTitle">Offroader settings</div><div class="sheetSub">Live cameras, route quality, and map layers.</div></div><button class="closeBtn" data-close>×</button></div><div class="settingsGrid"><div class="switchRow"><div><b>Show snapshot-only cameras</b><span>Live cameras stay green; snapshot cameras appear gray.</span></div><button id="photoToggle" class="toggle ${showPhotoCams?'on':''}"></button></div><div class="switchRow"><div><b>Show WSDOT detector dots</b><span>Colored by current measured speed.</span></div><button id="detToggle" class="toggle ${showDetectors?'on':''}"></button></div><div class="field"><label>MAPBOX PUBLIC TOKEN (OPTIONAL)</label><input id="mapboxInput" value="${esc(token)}" placeholder="pk.…"><div class="sheetSub" style="margin:6px 2px 0">With a token, Offroader uses Mapbox driving-traffic for much better route selection and traffic-aware ETAs. Without one, it uses OSRM plus WSDOT traffic scoring.</div></div><div class="row"><button id="saveSettings" class="primaryBtn">Save</button>${token?'<button id="clearToken" class="secondaryBtn">Remove token</button>':''}</div></div>`);$('photoToggle').onclick=()=>{showPhotoCams=!showPhotoCams;$('photoToggle').classList.toggle('on',showPhotoCams);if(showPhotoCams)photoLayer.addTo(map);else if(map.hasLayer(photoLayer))map.removeLayer(photoLayer);refreshDataPill()};$('detToggle').onclick=()=>{showDetectors=!showDetectors;$('detToggle').classList.toggle('on',showDetectors);$('trafficBtn').classList.toggle('active',showDetectors);if(showDetectors){drawDetectors();detectorLayer.addTo(map)}else if(map.hasLayer(detectorLayer))map.removeLayer(detectorLayer)};$('saveSettings').onclick=()=>{const v=$('mapboxInput').value.trim();if(v)localStorage.setItem('offroader_mapbox_token',v);else localStorage.removeItem('offroader_mapbox_token');setSheet();if(destination&&myLocation)makeRoute()};if($('clearToken'))$('clearToken').onclick=()=>{localStorage.removeItem('offroader_mapbox_token');$('mapboxInput').value='';}}
$('locBtn').onclick=()=>locate(true);$('camBtn').onclick=()=>{showLiveCams=!showLiveCams;$('camBtn').classList.toggle('active',showLiveCams);if(showLiveCams)cameraLayer.addTo(map);else if(map.hasLayer(cameraLayer))map.removeLayer(cameraLayer)};$('trafficBtn').onclick=()=>{showDetectors=!showDetectors;$('trafficBtn').classList.toggle('active',showDetectors);if(showDetectors){drawDetectors();detectorLayer.addTo(map)}else if(map.hasLayer(detectorLayer))map.removeLayer(detectorLayer)};$('settingsBtn').onclick=openSettings;$('brandBtn').onclick=()=>showMessage('Live cameras are green. Gray cameras are snapshot-only and are hidden by default. Search is biased toward your current area.');
Promise.all([loadTraffic(),loadCameras()]);setInterval(loadTraffic,5*60*1000);setInterval(loadCameras,10*60*1000);
</script>
