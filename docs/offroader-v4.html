<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Offroader v4</title>
<style>html,body,#app{width:100%;height:100%;margin:0;border:0;display:block;background:#e9edf2}</style>
</head>
<body>
<iframe id="app" src="offroader-v3.html" title="Offroader"></iframe>
<script>
const frame=document.getElementById('app');
frame.addEventListener('load',()=>{
  try{
    const d=frame.contentDocument;
    if(!d||d.getElementById('oregonLayerScript'))return;
    const s=d.createElement('script');
    s.id='oregonLayerScript';
    s.src='oregon-layers.js?v=4';
    s.onerror=()=>console.error('Offroader Oregon layer failed to load');
    d.body.appendChild(s);
  }catch(e){console.error(e);}
});
</script>
</body>
</html>
