name: Check Offroader web preview
on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - "docs/offroader-v3.html"
      - "docs/offroader-v4.html"
      - "docs/offroader-v5.html"
      - "docs/oregon-layers.js"
      - "docs/valhalla-routing.js"
      - "docs/index.html"
      - ".github/workflows/check-web-preview.yml"
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Syntax-check Oregon layer JavaScript
        run: node --check docs/oregon-layers.js
      - name: Syntax-check Valhalla routing JavaScript
        run: node --check docs/valhalla-routing.js
      - name: Syntax-check v5 wrapper JavaScript
        shell: bash
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path
          html=Path('docs/offroader-v5.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',html,re.I|re.S)
          if not scripts:
              raise SystemExit('No inline JavaScript found in v5 wrapper')
          Path('/tmp/offroader-v5.js').write_text('\n'.join(scripts),encoding='utf-8')
          PY
          node --check /tmp/offroader-v5.js
