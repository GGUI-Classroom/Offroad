name: Probe SDOT public map layers

on:
  push:
    branches: [ main ]
    paths:
      - "tools/probe_sdot_layers.py"
      - ".github/workflows/probe-sdot.yml"

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Probe public SDOT Traveler map layer types once
        run: python3 tools/probe_sdot_layers.py
