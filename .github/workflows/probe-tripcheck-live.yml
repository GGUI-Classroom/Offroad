name: Probe TripCheck live streaming implementation
on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/probe-tripcheck-live.yml'
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect TripCheck HTML and scripts
        shell: bash
        run: |
          python3 - <<'PY'
          import re, urllib.request, urllib.parse
          base='https://tripcheck.com/DynamicReports/Report/Cameras'
          req=urllib.request.Request(base,headers={'User-Agent':'Mozilla/5.0 Offroader probe'})
          with urllib.request.urlopen(req,timeout=60) as r:
            html=r.read().decode('utf-8','replace')
          print('HTML_LEN',len(html))
          for pat in ['trafficland','live streaming','streaming','camera','roadcam']:
            print('\nPATTERN',pat)
            for m in list(re.finditer(pat,html,re.I))[:12]:
              a=max(0,m.start()-240); b=min(len(html),m.end()+500)
              print(html[a:b].replace('\n',' ')[:1000])
          scripts=re.findall(r'<script[^>]+src=["\']([^"\']+)',html,re.I)
          print('\nSCRIPTS',scripts)
          for s in scripts:
            if s.startswith('//'): s='https:'+s
            elif s.startswith('/'): s='https://tripcheck.com'+s
            elif not s.startswith('http'): s=urllib.parse.urljoin(base,s)
            if 'tripcheck' not in s.lower(): continue
            try:
              req=urllib.request.Request(s,headers={'User-Agent':'Mozilla/5.0 Offroader probe'})
              with urllib.request.urlopen(req,timeout=45) as r:
                js=r.read().decode('utf-8','replace')
            except Exception as e:
              print('SCRIPT_FAIL',s,e); continue
            low=js.lower()
            if any(x in low for x in ['trafficland','live streaming','streaming','roadcam']):
              print('\nSCRIPT_MATCH',s,'LEN',len(js))
              for pat in ['trafficland','live streaming','streaming']:
                for m in list(re.finditer(pat,js,re.I))[:10]:
                  a=max(0,m.start()-350); b=min(len(js),m.end()+800)
                  print(js[a:b].replace('\n',' ')[:1400])
          PY
